name: zego_zimkit_demo
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  zego_uikit: ^2.29.4
  zego_zimkit: ^1.20.1
  zego_uikit_prebuilt_call: ^4.24.6
  zego_uikit_signaling_plugin: ^2.8.23

  cupertino_icons: ^1.0.2
  device_info_plus: any
  shared_preferences: ^2.2.3
  cached_network_image: ^4.0.4
  flutter_local_notifications: ^22.3.2
  crypto: ^3.0.3
  bot_toast: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: any

  import_sorter: any

import_sorter:
  comments: false

flutter:
  uses-material-design: true
  config:
    # Set to false to disable Swift Package Manager for this project.
    # This project setting takes precedence over the global Flutter setting.
    enable-swift-package-manager: true
